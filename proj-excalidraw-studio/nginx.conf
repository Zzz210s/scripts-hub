# 自建白板(薄壳) + 同源反代存储服务(/api)。同源的好处:前端不用处理 CORS,令牌只走请求头。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 场景 JSON 可能带图片(base64),放宽上传体积;存储服务自身也有上限
    client_max_body_size 40m;

    location /api/ {
        proxy_pass http://storage:9100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location = /api/health {
        proxy_pass http://storage:9100/health;
    }

    # 旧 PWA 的 sw.js 必须不被缓存:新脚本要能尽快接管并注销自己(见 public/sw.js)
    location = /sw.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存(文件名带 hash)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
