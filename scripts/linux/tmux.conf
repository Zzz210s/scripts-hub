# tmux 配置:为 AI 会话准备(2026-10-04)
#
# 目的:SSH 断线、终端关掉、笔记本合盖,都不会中断跑在里面的 AI 会话 —— 重连后 attach 回来接着看。
# 用法见同目录的 ai 脚本(~/bin/ai)与 0-Note 的记录。

# ── 手感 ─────────────────────────────────────────────
set -g mouse on                 # 鼠标可用:点选窗格、拖边框调大小、滚轮翻历史
set -g history-limit 50000      # 回滚行数(pi 输出很多,默认 2000 不够)
set -g escape-time 0            # 让 ESC 立刻生效(pi / vim 的按键不被延迟吞掉)
set -g focus-events on          # 焦点变化通知给程序(部分 TUI 依赖)
# pi 官方文档(docs/tmux.md)对 tmux 3.5+ 的要求,原样照抄:不开这两项,Shift+Enter
# 换行、Ctrl+Enter 会被 tmux 报成普通 Enter,pi 分不出来(它启动时也会打印警告)。
# 服务器上是 tmux 3.6,走 csi-u 这条路。
set -g extended-keys on
set -g extended-keys-format csi-u
set -g base-index 0
set -g renumber-windows on      # 关掉窗口后编号不留空洞
set -g detach-on-destroy off    # 关掉一个窗口不连带杀掉整个会话

# ── 显示 ─────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"   # 真彩色(pi 的界面配色正常)
set -g status-interval 5
set -g status-left "#[bold] #S "     # 左边显示会话名(attach 回来先看这里)
set -g status-right "%m-%d %H:%M "
setw -g mode-keys vi                 # 复制模式用 vi 键位(默认 emacs)

# ── 剪贴板 ───────────────────────────────────────────
set -g set-clipboard on              # 支持 OSC 52 的终端里可直接复制到本机剪贴板

# ── 提示(默认前缀是 C-b;这里不改,免得记混)────────────
# C-b d  脱离(detach):会话继续在后台跑,SSH 断开也是这个效果
# C-b s  列出会话并切换        C-b c 新窗口      C-b % / " 左右、上下分屏
# C-b [  进入复制模式(vi 键位,滚轮也行)
