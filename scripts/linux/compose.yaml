# 自动化套件(微软积分 + 微信读书签到)的容器定义
#
# 两个服务都是"跑一次就退出"的一次性容器:宿主侧的 run-all.sh / systemd timer 顺序触发,
# 容器里没有常驻进程、没有 cron —— 顺序由编排脚本保证(一项结束才启动下一项)。
# 代码在镜像里,配置/状态/凭据挂宿主目录。
#
# 用法(宿主):
#   docker compose -f /srv/apps/automation/compose.yaml run --rm -T rewards-run
#   docker compose -f /srv/apps/automation/compose.yaml run --rm -T weread-run
# 正常路径不要手敲这两条,用 run-all.sh(它带守卫、看门狗与通知)。

services:
  rewards-run:
    image: automation-rewards:local
    container_name: rewards-run
    restart: "no"
    entrypoint: ["/bin/bash", "/opt/deploy/run-once.sh"]
    env_file:
      - ./rewards/.env
    environment:
      TZ: Asia/Shanghai
      # 一次性运行:不让上游 entrypoint 起 cron,也不让容器启动就跑
      RUN_ON_START: "false"
      CRON_SCHEDULE: "0 0 31 2 *"
      SKIP_RANDOM_SLEEP: "true"
      STUCK_PROCESS_TIMEOUT_HOURS: "3"
    volumes:
      - ./rewards/config:/usr/src/microsoft-rewards-script/config
      - ./rewards/sessions:/usr/src/microsoft-rewards-script/sessions
      - ./rewards/deploy:/opt/deploy:ro
    security_opt:
      - no-new-privileges:true
    # 一次运行约 1~1.5 GB(2 集群 = 4 个 headless Chromium);留够余量,超了让容器自己 OOM,不拖垮宿主
    mem_limit: 2600m

  weread-run:
    image: automation-weread:local
    container_name: weread-run
    restart: "no"
    entrypoint: ["/bin/bash", "/opt/deploy/run-once.sh"]
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./weread/.env:/opt/weread/.env:ro
      # config.yaml 以"模板"形式只读挂进来,由 run-once.sh 复制到容器可写层再用 ——
      # 直接挂成 /opt/weread/config.yaml 的话,程序改配置时的 tmp+rename 会 EBUSY(2026-10-05 踩到)
      - ./weread/config.yaml:/opt/weread/config.template.yaml:ro
      - ./weread/secrets:/opt/weread/secrets
      - ./weread/data:/opt/weread/data
      - ./weread/logs:/opt/weread/logs
      # 同伴(微软积分)的单实例锁:错峰判定要用(.env 的 BUSY_PEERS 指到这里)
      - ./rewards/logs:/peers/rewards:ro
      - ./weread/deploy:/opt/deploy:ro
    security_opt:
      - no-new-privileges:true
    mem_limit: 800m

  # 服务器侧体检工具(按需跑,非常驻):scripts-hub 的四个纯 Node 模块
  # 镜像里只有 node + git + restic;仓库本体留在宿主挂进来,更新工具只要 git pull
  suite-check:
    image: automation-suite-check:local
    container_name: suite-check
    restart: "no"
    entrypoint: ["/bin/bash", "/opt/suite-check/entrypoint.sh"]
    environment:
      TZ: Asia/Shanghai
      REPO_DIR: /repo
      PRIVATE_DIR: /private
      SUITE_DIR: /data
      SENSITIVE_PATTERNS_FILE: /private/sensitive-patterns.txt
      AUTOMATION_LOCAL_PATHS: /private/local-paths.env
    volumes:
      - ${HOME}/scripts-hub:/repo:ro
      # 清单里的 %HOME_DIR% 展开成 /home/ubuntu/... ,所以这两个目录要按同样的路径挂进来,
      # 否则备份盘点会把"存在但没挂"误报成缺失(2026-10-05 实测踩到)
      # 容器内路径 = 宿主家目录(清单里的 %HOME_DIR% 展开成宿主家目录,两边必须一致)。
      # 写成 ${HOME} 而不是字面量 /home/ubuntu:仓库是公开的,脱敏检查会拦家目录路径。
      - ${HOME}/.pi:${HOME}/.pi:ro
      - ${HOME}/.config:${HOME}/.config:ro
      - ${HOME}/.config/automation-suite:/private:ro
      - /srv/apps/automation:/data:ro
      - /etc/systemd/system:/etc/systemd/system:ro
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

  epic-run:
    image: automation-epic:local
    container_name: epic-run
    restart: "no"
    entrypoint: ["/bin/bash", "/opt/deploy/run-once.sh"]
    environment:
      TZ: Asia/Shanghai
      # 同伴(另两个程序)的单实例锁:错峰判定要用(.env 侧的 EPIC_BUSY_PEERS)
      EPIC_BUSY_PEERS: /peers/rewards/run.lock
    volumes:
      - ./epic/data:/opt/epic/data
      - ./epic/logs:/opt/epic/logs
      - ./epic/secrets:/opt/epic/secrets
      # 上游引擎的结果文件(lowdb);挂出来便于回查每次领取的细节
      - ./epic/vendor-data:/opt/epic/vendor/free-games-claimer/data
      - ./rewards/logs:/peers/rewards:ro
      - ./epic/deploy:/opt/deploy:ro
    security_opt:
      - no-new-privileges:true
    # 浏览器 + Xvfb 要额外共享内存与 init(回收 Xvfb/Chromium 的僵尸进程)
    shm_size: 1g
    init: true
    mem_limit: 1800m
